name: Daily Script Runner

on:
  schedule:
    # 每天UTC时间1点执行（北京时间上午9点）
    - cron: '1/2 * * * *'
    # 也可以添加多个时间点
    # - cron: '0 13 * * *'  # 每天UTC时间13点（北京时间21点）
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:    
      run: echo "Setting up environment..."
    
    - name: Run daily script
      run: |
        chmod +x daily.sh
        ./daily.sh
      run: echo "script  ok..."
